<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise-4</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@1,500&display=swap');
    </style>
    <style>
        :root {
            --color: rgb(9, 3, 3);
            --bgcolor:rgb(242, 227, 227);
        }

        body{
            background-color: var(--bgcolor);

        }
        * {
            margin: 0;
            padding: 0;
            font-family: po;
            font-family: 'Poppins', sans-serif;
        }

        div a {
            display: inline-block;
            text-decoration: none;
            padding: 0px 2px;
            color: rgb(132, 28, 28);
            /* border: 2px solid; */
            height: 20px;
            width: 100px;
            margin-top: 3px;

        }

        .navbar {
            background-color: rgb(207, 133, 133);
            height: 30px;
            /* padding: 5px; */

        }

        span a:hover {
            background-color: var(--color);
            border-radius: 6px;
            color: white;
        }
    </style>
</head>

<body>
    <div class="navbar">
        <span><a href="" class="nav">Home</a></span>
        <span><a href="" class="nav">About</a></span>
        <span><a href="" class="nav">Contact US</a></span>
        <span><a href="" class="nav">Help</a></span>
        <span><a href="" class="nav">Search</a></span>
    </div>
</body>

</html>
