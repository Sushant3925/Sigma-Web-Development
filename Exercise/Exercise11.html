<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise-11</title>
</head>
<body>
    <script>
        // factorial using reduce method

        let arr = [6,5,4,3,2,1]

        const fact = (a,b)=>{
            return a*b;
        }
        console.log("Factorial of 6 using reduce method: ")
        console.log(arr.reduce(fact))

        let n = prompt("Enter the number: ")
        let fac = 1;
        if(n > 0) {
            for(let i =1; i<=6;i++)
            {
                fac *=i;
            }

        }
        console.log("Factorial of "+n+" is :"+fac)
    </script>
</body>
</html>
