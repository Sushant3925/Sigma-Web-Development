<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google forms</title>
</head>
<body>

    <div>
        <h1>Employee Details Form</h1>

        <form action="post">
            <div>
                <label for="name">Enter Employee name : </label>
                <input type="text" name="Username" id="name" placeholder="Enter Employee Name">
            </div>
           <div>
               <div>
                   <label for="city">Enter city name :</label>
                   <input id="city"  type="text" name="Username" placeholder="Enter Your CITY name"> 
                </div>
            </div>
            <div>
                <div>
                    <label for="pincode">Enter the Pincode: </label>
                    <input type="pincode" id="pincode" placeholder="Enter pincode">
                </div>
            </div>
            <div>
                <div>
                    <label for="submit"></label>
                    <input type="submit" id="submit">
                </div>
            </div>
            </form>

    </div>

</body>
</html>
