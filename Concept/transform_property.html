<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transform Peoperty</title>
    <style>
        .container {
            height: 500px;
            width: 800px;
            border: 2px solid brown;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px ;

        }

        .box {
            height: 100px;
            width: 100px;
            border: 2px solid brown;
            background-color: aqua;
        }
        .main{
            display: flex inline;
            justify-content: center;
            align-items: center;
        }
        .box1:hover{
                transform: rotate(45deg);
        }
        .box2:hover{
                transform:scaleX(1.2);
                background-color: rgb(182, 247, 247);
        }
       
        .box3:hover{
                transform:skew(45deg);
                
        }
       
        .box1:hover{
                transform: rotate(45deg);
        }
        .box1:hover{
                transform: rotate(45deg);
        }
    </style>
</head>

<body>
    <div class="main">
        
    <div class="container">
        <div class="box box1">box1</div>
        <div class="box box2"></div>
        <div class="box box3"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
    </div>
    <div class="container">
        <div class="box box1"></div>
        <div class="box box2"></div>
        <div class="box box3"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
    </div>
    </div>

</body>

</html>
